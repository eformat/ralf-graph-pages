<!DOCTYPE html>
<html lang="en">
<head>

<title>EvalHub · LightEval GA — demo</title>
<style>
/* ===========================================================
   Arcade-style demo player — sibling pattern of
   evalhub-eval-gallery-demo.html / automated-red-teaming-garak-demo.html.
   Recording space: 1920x1080 — the real pixel space of the i1096 act-phase
   screenshots and of the demo steps' targets (1:1, no scaling).

   Self-contained: the RECORD evidence board embeds REAL captured dashboard
   screenshots as data URIs (byte-identical, full-res); the ENV / failed-state
   and factory beats are neutral terminal / schematic panels drawn from the
   real captured values. No external network fetches; works from file://.
   =========================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #EE0000;
  --marker: #6D5AE6;
  --dim: rgba(17, 24, 39, 0.25);
  --chrome-bg: rgba(21, 21, 21, 0.92);
  --chrome-fg: #f0f0f0;
  --chrome-dim: #9a9a9a;
  --border: #3a3a3a;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --zoom-dur: 0.7s;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #0b0b0c;
  font-family: 'Red Hat Display', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#stage { position: absolute; inset: 0; }

#frame {
  position: absolute; top: 50%; left: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%);
  background: #111;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 30px 90px rgba(0,0,0,.6);
}

#camera {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  transition: transform var(--zoom-dur) var(--ease);
  will-change: transform;
}

.scene {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  opacity: 0;
  transition: opacity 0.35s ease;
  background: #0d0f12;
}
.scene.on { opacity: 1; }
.scene img.shot { width: 100%; height: 100%; display: block; }

#spot {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  border: 6px solid var(--accent);
  border-radius: 12px;
  box-shadow: 0 0 0 4000px var(--dim);
  transition:
    opacity 0.18s ease-out,
    left var(--zoom-dur) var(--ease),
    top var(--zoom-dur) var(--ease),
    width var(--zoom-dur) var(--ease),
    height var(--zoom-dur) var(--ease),
    border-width var(--zoom-dur) var(--ease),
    border-radius var(--zoom-dur) var(--ease);
}
#spot.on { opacity: 1; }

#marker {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease, left var(--zoom-dur) var(--ease), top var(--zoom-dur) var(--ease);
}
#marker.on { opacity: 1; }
#marker .dot {
  position: absolute; top: 50%; left: 50%;
  width: 18px; height: 18px;
  transform: translate(-50%, -50%);
  background: var(--marker);
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(109, 90, 230, 0.35);
}
#marker .ring {
  position: absolute; top: 50%; left: 50%;
  width: 30px; height: 30px;
  transform: translate(-50%, -50%);
  border: 3px solid var(--marker);
  border-radius: 50%;
  animation: pulse 1.6s ease-out infinite;
}
@keyframes pulse {
  0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
}

#hud {
  position: absolute; top: 22px; left: 26px;
  display: flex; align-items: baseline; gap: 14px;
  z-index: 20; pointer-events: none;
}
#hud .title {
  color: var(--chrome-fg); font-size: 17px; font-weight: 700; letter-spacing: .02em;
  background: var(--chrome-bg); border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 9px;
}
#hud .count { color: var(--chrome-dim); font-size: 14px; }

#caption {
  position: absolute;
  bottom: 56px; left: 50%;
  transform: translateX(-50%);
  max-width: 1420px;
  padding: 13px 30px;
  background: var(--chrome-bg);
  color: var(--chrome-fg);
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.35;
  text-align: center;
  transition: opacity 0.22s ease;
  z-index: 20;
}
#caption.swap { opacity: 0; }

#pills {
  position: absolute;
  bottom: 40px; left: 40px;
  display: flex; gap: 8px;
  align-items: center;
  z-index: 20;
}
.pill {
  height: 12px; width: 26px;
  border-radius: 6px;
  background: rgba(240, 240, 240, 0.22);
  border: none; cursor: pointer; padding: 0;
  transition: width 0.3s var(--ease), background 0.3s ease;
}
.pill.done { background: rgba(109, 90, 230, 0.55); }
.pill.cur  { width: 72px; background: var(--marker); }
.pill:hover { background: var(--marker); }

#controls {
  position: absolute;
  bottom: 34px; right: 40px;
  display: flex; gap: 10px;
  z-index: 20;
}
.btn {
  min-width: 46px; height: 46px;
  padding: 0 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--chrome-bg);
  color: var(--chrome-fg);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 19px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { background: rgba(60,60,64,.95); border-color: #555; }
.btn.on { border-color: var(--marker); color: #fff; }

#keys {
  position: absolute;
  top: 22px; right: 26px;
  color: rgba(240,240,240,.45);
  font-size: 13px;
  z-index: 20; pointer-events: none;
}

#panel {
  position: absolute;
  top: 78px; right: 26px; bottom: 104px;
  width: 430px;
  background: var(--chrome-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--chrome-fg);
  transform: translateX(470px);
  transition: transform 0.4s var(--ease);
  z-index: 25;
  display: flex; flex-direction: column;
  overflow: hidden;
}
#panel.open { transform: translateX(0); }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
}
.panel-head h3 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--chrome-dim); font-weight: 700; }
.panel-head .hide {
  background: none; border: 1px solid var(--border); color: var(--chrome-dim);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.panel-head .hide:hover { color: var(--chrome-fg); border-color: #555; }
#rows { padding: 2px 18px 18px; overflow-y: auto; }
#rows .row { padding: 10px 0; border-top: 1px solid rgba(255,255,255,.07); }
#rows dt { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--marker); margin-bottom: 4px; }
#rows dd { font-size: 13.5px; line-height: 1.5; color: #d6d6d6; }

/* ── schematic panels (ENV / failed-state / factory beats) ── */
.pcard, .term, .board, .author, .pipeline, .checklist { position: absolute; }

.term {
  background: #0d1117;
  border: 2px solid #30363d;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
  display: flex; flex-direction: column;
}
.term-head {
  height: 50px; flex: 0 0 50px;
  background: #161b22; border-bottom: 1px solid #30363d;
  display: flex; align-items: center; gap: 14px; padding: 0 20px;
}
.term-head .dots i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 7px; }
.term-head .dots i:nth-child(1) { background: #ff5f56; }
.term-head .dots i:nth-child(2) { background: #ffbd2e; }
.term-head .dots i:nth-child(3) { background: #27c93f; }
.term-title { color: #e6edf3; font-weight: 600; font-size: 16px; }
.term-note { margin-left: auto; color: #8b949e; font-size: 12.5px; }
.term-body { flex: 1 1 auto; padding: 16px 26px; overflow: hidden; }
.tl { font-family: 'Red Hat Mono','DejaVu Sans Mono','Courier New',monospace; font-size: 16.5px; line-height: 1.78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl.c { color: #e6edf3; }
.tl.c .p { color: #3fb950; font-weight: 700; }
.tl.o { color: #c9d1d9; }
.tl.k { color: #56d364; }
.tl.d { color: #8b949e; font-size: 14.5px; }
.term-foot { flex: 0 0 auto; padding: 10px 26px 14px; color: #6e7681; font-size: 12.5px; font-family: 'Red Hat Mono','DejaVu Sans Mono',monospace; }

.board {
  background: #0d1117;
  border: 2px solid #30363d;
  border-radius: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
  padding: 14px 18px 10px;
  display: flex; flex-direction: column;
}
.board-title { color: #e6edf3; font-size: 16.5px; font-weight: 700; margin-bottom: 10px; }
.shots { display: flex; gap: 12px; margin-bottom: 12px; }
.shots figure { flex: 1 1 0; min-width: 0; margin: 0; }
.shots img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border: 1px solid #30363d; border-radius: 6px; background: #fff; }
.shots figcaption { color: #9aa4b2; font-size: 11.5px; line-height: 1.35; padding: 5px 2px 0; }
.shots figcaption b { color: #58a6ff; }
.board-term { background: #090c10; border: 1px solid #21262d; border-radius: 8px; padding: 8px 16px; }
.board-term .tl { font-size: 14px; line-height: 1.62; }
.board-foot { margin-top: 8px; color: #6e7681; font-size: 11.5px; font-family: 'Red Hat Mono','DejaVu Sans Mono',monospace; }

.card { background: #12151b; border: 2px solid #30363d; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.card-head { padding: 12px 18px; color: #e6edf3; font-weight: 700; font-size: 16px; background: #161b22; border-bottom: 1px solid #30363d; }
.card pre { flex: 1; padding: 14px 18px; color: #c9d1d9; font-family: 'Red Hat Mono','DejaVu Sans Mono',monospace; font-size: 13px; line-height: 1.72; margin: 0; }
.card-foot { padding: 10px 18px; color: #8b949e; font-size: 12.5px; border-top: 1px solid #21262d; }
.author { display: flex; gap: 24px; }
.author .tree { flex: 0 0 660px; }
.author .gae { flex: 1 1 auto; }
.gae img { width: calc(100% - 36px); margin: 14px 18px 8px; border: 1px solid #30363d; border-radius: 6px; display: block; background: #fff; }
.gae .verbatim { padding: 4px 18px 10px; color: #e6edf3; font-size: 15.5px; }
.gae .verbatim b { color: #ffdf5d; }

.pipeline { display: flex; align-items: stretch; gap: 0; }
.pipebox {
  flex: 1 1 0; background: #12151b; border: 2px solid #30363d; border-radius: 14px;
  padding: 18px 20px; min-width: 0;
}
.pipe-num { color: var(--marker); font-weight: 800; font-size: 14px; letter-spacing: .1em; }
.pipe-title { color: #e6edf3; font-weight: 700; font-size: 19px; margin: 6px 0 8px; }
.pipe-body { color: #9aa4b2; font-size: 13.5px; line-height: 1.5; }
.arrow { align-self: center; color: #6e7681; font-size: 34px; padding: 0 12px; flex: 0 0 auto; }

.checklist { background: #0d1117; border: 2px solid #30363d; border-radius: 14px; padding: 6px 0 0; }
.chk { display: flex; align-items: baseline; gap: 14px; padding: 11px 22px; border-top: 1px solid #161b22; }
.chk:first-of-type { border-top: none; }
.chk-g { flex: 0 0 26px; text-align: center; font-size: 18px; }
.chk-g.ok { color: #56d364; }
.chk-g.open { color: #d29922; }
.chk-label { flex: 0 0 320px; color: #e6edf3; font-weight: 700; font-size: 16px; }
.chk-note { color: #9aa4b2; font-size: 14px; line-height: 1.45; min-width: 0; }
</style>
</head>

const W = DATA.videoW || 1920, H = DATA.videoH || 1080;
const DWELL = DATA.dwell || 6.0;
const steps = DATA.steps;
let cur = -1;
let SCALE = 1;
let playing = false;
let playTimer = null;
let userPanel = null;
let sceneFlip = false;

const $ = (id) => document.getElementById(id);
const frameEl = $('frame'), camEl = $('camera'),
      spotEl = $('spot'), markerEl = $('marker'),
      capEl = $('caption'), pillsEl = $('pills'), panelEl = $('panel'),
      rowsEl = $('rows'), sceneA = $('sceneA'), sceneB = $('sceneB');

for (const el of [frameEl, camEl, sceneA, sceneB]) {
  el.style.width = W + 'px';
  el.style.height = H + 'px';
}

function layout() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.985;
  SCALE = s;
  frameEl.style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener('resize', layout);

function computeZoom(step) {
  if (!step.target) return { s: 1, tx: 0, ty: 0 };
  const r = step.target;
  const maxS = step.zoomMax || 2.5;
  let s = Math.min(0.55 * W / r.w, 0.55 * H / r.h, maxS);
  if (s < 1) s = 1;                        // wide rects: recenter only
  const tx = W / 2 - s * (r.x + r.w / 2);
  const ty = H / 2 - s * (r.y + r.h / 2);
  return { s, tx, ty };
}

function showScene(step) {
  const showEl = sceneFlip ? sceneA : sceneB;
  const hideEl = sceneFlip ? sceneB : sceneA;
  if (step.src) {
    showEl.innerHTML = '<img class="shot" alt="" src="' + step.src + '">';
  } else {
    showEl.innerHTML = step.panelHtml || '';
  }
  showEl.classList.add('on');
  hideEl.classList.remove('on');
  sceneFlip = !sceneFlip;
}

function goTo(i, opts = {}) {
  i = Math.max(0, Math.min(steps.length - 1, i));
  if (i === cur && !opts.force) return;
  cur = i;
  const step = steps[i];
  const { s, tx, ty } = computeZoom(step);

  showScene(step);
  camEl.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;

  if (step.target) {
    const r = step.target;
    spotEl.style.left = r.x + 'px';
    spotEl.style.top = r.y + 'px';
    spotEl.style.width = r.w + 'px';
    spotEl.style.height = r.h + 'px';
    spotEl.style.borderWidth = Math.max(1.5, 6 / s) + 'px';
    spotEl.style.borderRadius = (12 / s) + 'px';
    spotEl.classList.add('on');
  } else {
    spotEl.classList.remove('on');
  }

  const mk = step.marker === false ? null : (step.marker || (step.target && { x: step.target.x + step.target.w / 2, y: step.target.y + step.target.h / 2 }));
  if (mk) {
    markerEl.style.left = mk.x + 'px';
    markerEl.style.top = mk.y + 'px';
    markerEl.style.transform = `scale(${1 / Math.max(1, s * 0.75)})`;
    markerEl.classList.add('on');
  } else {
    markerEl.classList.remove('on');
  }

  capEl.classList.add('swap');
  setTimeout(() => { capEl.textContent = step.caption || ''; capEl.classList.remove('swap'); }, 190);

  [...pillsEl.children].forEach((p, idx) => {
    p.className = 'pill' + (idx < i ? ' done' : idx === i ? ' cur' : '');
  });
  $('hudTitle').textContent = DATA.title || '';
  $('hudCount').textContent = `${i + 1} / ${steps.length}`;

  renderRows(step);
  const want = userPanel === null ? (step.details && step.details.length > 0) : userPanel;
  panelEl.classList.toggle('open', !!want);
}

function renderRows(step) {
  rowsEl.innerHTML = '';
  (step.details || []).forEach(d => {
    const row = document.createElement('div');
    row.className = 'row';
    const dt = document.createElement('dt'); dt.textContent = d.label;
    const dd = document.createElement('dd'); dd.textContent = d.value;
    row.appendChild(dt); row.appendChild(dd);
    rowsEl.appendChild(row);
  });
}

function scheduleNext() {
  clearTimeout(playTimer);
  if (!playing) return;
  playTimer = setTimeout(() => {
    if (cur >= steps.length - 1) { stopPlay(); return; }
    goTo(cur + 1);
  }, (steps[cur] && steps[cur].dwell || DWELL) * 1000);
}
function startPlay() {
  playing = true;
  $('playBtn').classList.add('on');
  $('playBtn').textContent = '❚❚';
  if (cur >= steps.length - 1) goTo(0, { force: true });
  else goTo(cur + 1);
}
function stopPlay() {
  playing = false;
  clearTimeout(playTimer);
  $('playBtn').classList.remove('on');
  $('playBtn').textContent = '▶▶';
}

$('prevBtn').addEventListener('click', () => { stopPlay(); goTo(cur - 1); });
$('nextBtn').addEventListener('click', () => { stopPlay(); goTo(cur + 1); });
$('playBtn').addEventListener('click', () => playing ? stopPlay() : startPlay());
$('replayBtn').addEventListener('click', () => { stopPlay(); goTo(0, { force: true }); });
$('hideBtn').addEventListener('click', () => {
  userPanel = !panelEl.classList.contains('open');
  panelEl.classList.toggle('open', userPanel);
});
pillsEl.addEventListener('click', e => {
  const pills = [...pillsEl.children];
  const idx = pills.indexOf(e.target);
  if (idx >= 0) { stopPlay(); goTo(idx, { force: true }); }
});
frameEl.addEventListener('click', e => {
  if (e.target.closest('#controls,#pills,#panel,#caption')) return;
  stopPlay();
  goTo(cur + 1);
});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); stopPlay(); goTo(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); stopPlay(); goTo(cur - 1); }
  else if (e.key === 'Home') { stopPlay(); goTo(0, { force: true }); }
  else if (e.key === 'End') { stopPlay(); goTo(steps.length - 1, { force: true }); }
  else if (e.key === 'f' || e.key === 'F') { playing ? stopPlay() : startPlay(); }
  else if (e.key === 'd' || e.key === 'D') { $('hideBtn').click(); }
  else if (e.key === 'r' || e.key === 'R') { stopPlay(); goTo(0, { force: true }); }
});

/* boot */
pillsEl.innerHTML = steps.map(() => '<button class="pill" aria-label="step"></button>').join('');
layout();
goTo(0, { force: true });
</script>
